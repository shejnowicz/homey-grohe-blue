<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <form id="login-form">
      <fieldset class="homey-form-fieldset">
        <legend class="homey-form-legend" data-i18n="pair.login.title"></legend>
        <div class="homey-form-group">
          <label class="homey-form-label" for="username" data-i18n="pair.login.username"></label>
          <input class="homey-form-input" id="username" name="username" type="email" autocomplete="username" required>
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="password" data-i18n="pair.login.password"></label>
          <input class="homey-form-input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
      </fieldset>
      <button class="homey-button-primary-full" type="submit" data-i18n="pair.login.submit"></button>
    </form>

    <script>
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        element.textContent = Homey.__(element.dataset.i18n);
      });

      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        Homey.showLoadingOverlay();
        try {
          await Homey.emit('login', {
            username: usernameInput.value,
            password: passwordInput.value,
          });
          Homey.nextView();
        } catch {
          Homey.alert(Homey.__('pair.login.failed'));
        } finally {
          passwordInput.value = '';
          Homey.hideLoadingOverlay();
        }
      });
    </script>
  </body>
</html>
